name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-lint:
    name: Agent lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pipx install ruff

      - name: Check lint rules
        run: ruff check --output-format=github .

  agent-test:
    name: Agent tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt
          pip install pytest

      - name: Run test suite
        working-directory: agent
        run: python -m pytest -q

      - name: Assert the API imports and registers routes
        working-directory: agent
        run: |
          python -c "
          import main
          assert len(main.app.routes) > 0, 'no routes registered'
          print(f'{len(main.app.routes)} routes registered')
          "

  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Build
        working-directory: dashboard
        env:
          NEXT_PUBLIC_AGENT_URL: http://localhost:8080
          # Clerk validates the key format while prerendering, so the build needs a
          # syntactically valid pair. These are placeholders for a fictional domain
          # and grant no access to anything.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_placeholder_used_only_to_satisfy_the_build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build agent image
        run: docker build -t nebulaseo-agent:ci ./agent

      - name: Build dashboard image
        run: docker build -t nebulaseo-dashboard:ci ./dashboard
