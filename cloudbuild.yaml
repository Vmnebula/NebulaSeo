# ==============================================================================
# NebulaSEO — Cloud Build CI/CD Pipeline
# Builds and deploys Agent backend and Dashboard frontend in parallel to Cloud Run
# ==============================================================================

substitutions:
  _REGION: us-central1
  _AGENT_SERVICE: nebulaseo-agent
  _DASHBOARD_SERVICE: nebulaseo-dashboard

steps:
  # --------------------------------------------------------------------------
  # 1. Build Agent Backend Container
  # --------------------------------------------------------------------------
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-agent'
    args:
      - '--context=dir://agent'
      - '--dockerfile=agent/Dockerfile'
      - '--destination=gcr.io/$PROJECT_ID/$_AGENT_SERVICE:$COMMIT_SHA'
      - '--destination=gcr.io/$PROJECT_ID/$_AGENT_SERVICE:latest'
      - '--cache=true'
      - '--cache-ttl=168h'

  # --------------------------------------------------------------------------
  # 2. Build Dashboard Frontend Container
  # --------------------------------------------------------------------------
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-dashboard'
    args:
      - '--context=dir://dashboard'
      - '--dockerfile=dashboard/Dockerfile'
      - '--destination=gcr.io/$PROJECT_ID/$_DASHBOARD_SERVICE:$COMMIT_SHA'
      - '--destination=gcr.io/$PROJECT_ID/$_DASHBOARD_SERVICE:latest'
      - '--cache=true'
      - '--cache-ttl=168h'

  # --------------------------------------------------------------------------
  # 3. Deploy Agent Backend to Cloud Run
  # --------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-agent'
    waitFor: ['build-agent']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_AGENT_SERVICE'
      - '--image=gcr.io/$PROJECT_ID/$_AGENT_SERVICE:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=300'
      - '--port=8080'

  # --------------------------------------------------------------------------
  # 4. Deploy Dashboard to Cloud Run
  # --------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-dashboard'
    waitFor: ['build-dashboard']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_DASHBOARD_SERVICE'
      - '--image=gcr.io/$PROJECT_ID/$_DASHBOARD_SERVICE:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=60'
      - '--port=8080'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '900s'
