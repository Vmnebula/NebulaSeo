services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-False}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - TARGET_SITE_URL=${TARGET_SITE_URL:-https://example.com}
      - GSC_SITE_URL=${GSC_SITE_URL:-sc-domain:example.com}
      - GITHUB_REPO=${GITHUB_REPO:-your-org/your-repo}
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID:-}
      - GOOGLE_PSI_API_KEY=${GOOGLE_PSI_API_KEY:-}
      - GOOGLE_CUSTOM_SEARCH_API_KEY=${GOOGLE_CUSTOM_SEARCH_API_KEY:-}
      - GOOGLE_CUSTOM_SEARCH_CX=${GOOGLE_CUSTOM_SEARCH_CX:-}
    env_file:
      - .env

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are inlined into the client bundle during the build, so
      # they have to be passed here. Setting them under `environment` alone would not
      # reach the browser code.
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk}
        CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_placeholder_used_only_to_satisfy_the_build}
        NEXT_PUBLIC_AGENT_URL: ${NEXT_PUBLIC_AGENT_URL:-http://localhost:8080}
    ports:
      - "3000:8080"
    environment:
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - AGENT_INTERNAL_URL=http://agent:8080
    env_file:
      - .env
    depends_on:
      - agent
