[tool.ruff]
line-length = 120
target-version = "py311"
src = ["agent"]
exclude = ["dashboard", ".venv", "venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4"]
ignore = [
    "B008",  # FastAPI depends on function calls in argument defaults
    "B904",  # `raise ... from` is not applied consistently in this codebase yet
]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
pythonpath = ["agent"]
addopts = "-ra"
